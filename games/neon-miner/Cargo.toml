[package]
name = "myelin-neon-miner"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A playable, replayable game using real Myelin sessions"

[dependencies]
myelin-session = { path = "../../../Myelin/session" }
myelin-consensus = { path = "../../../Myelin/consensus" }
myelin-session-store-rocksdb = { path = "../../../Myelin/session-store-rocksdb" }
myelin-session-runtime = { path = "../../../Myelin/session-runtime" }
myelin-session-authority = { path = "../../../Myelin/session-authority" }
myelin-session-journal = { path = "../../../Myelin/session-journal" }
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
blake3 = "1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = "0.2"
tiny_http = "0.12"
tempfile = "3"

[workspace]
